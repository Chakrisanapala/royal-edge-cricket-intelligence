# Netlify Build and Routing Configuration for ROYAL EDGE

[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  VITE_API_URL = "https://royal-edge-backend.onrender.com/api"

# Proxy /api requests directly to Render backend
[[redirects]]
  from = "/api/*"
  to = "https://royal-edge-backend.onrender.com/api/:splat"
  status = 200
  force = true

# React Router handles application routes in the browser (SPA Fallback)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and cache headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
